name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # Writes the token setting for GitHub Packages outside the repository. pnpm
          # refuses to read a token from the project's own .npmrc.
          registry-url: https://npm.pkg.github.com
          scope: '@fermain'
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
        env:
          # Frame is installed from GitHub Packages, which asks for a token even to read.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Where the editor at /admin signs in and saves. Neither value is secret; the project
          # id is a repository variable, set once the site has been added to the hub.
          VITE_FRAME_HUB: https://frame-858793217902.africa-south1.run.app
          VITE_FRAME_PROJECT: ${{ vars.FRAME_PROJECT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
